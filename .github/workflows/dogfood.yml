name: Dogfood — add issues to the projmagic boards

# projmagic eats its own dog food: every issue opened in this repo is auto-added
# to BOTH projmagic Projects v2 boards by calling our own reusable workflow
# through a local path reference. This also exercises the multi-board fan-out.
#
# Note the `issues` trigger lives HERE, in the caller — the reusable workflow
# declares none (reusable workflows run in the caller's event context).

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    uses: ./.github/workflows/add-to-project.yml
    with:
      project-urls: |
        https://github.com/users/jvrck/projects/34
        https://github.com/users/jvrck/projects/35
    secrets:
      token: ${{ secrets.PROJMAGIC_TOKEN }}
